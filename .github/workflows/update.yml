name: Update goalie tracker
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - uses: actions/cache@v4
        with:
          path: |
            cache.json
            logos
          key: tracker-${{ github.run_id }}
          restore-keys: tracker-
      - run: python goalie_tracker.py
      - name: Collect site files
        run: |
          mkdir site
          cp index.html logo.png data.json site/
          if [ -d logos ]; then cp -r logos site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Keep the schedule running
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 4320000 ]; then
            git config user.name "goalie-tracker-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled updates running"
            git push
          fi
