<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Goalie Mindset Pro Client Tracker</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#151515;--card2:#1c1c1c;--ink:#f4f4f4;--ash:#9a9a9a;--line:#2a2a2a;--red:#e3262b;--red2:#ff3b40;--deep:#8f1418}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;
 background-image:radial-gradient(1200px 400px at 50% -200px,rgba(227,38,43,.18),transparent 70%)}
.stripe{height:6px;background:linear-gradient(90deg,var(--deep),var(--red),var(--deep))}
header{padding:24px 20px 14px;max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.logo{height:84px;flex:none}
.logo img{height:100%;width:auto;display:block;filter:drop-shadow(0 6px 18px rgba(227,38,43,.35))}
h1{font:800 40px/0.95 "Barlow Condensed",sans-serif;margin:0;text-transform:uppercase;letter-spacing:.5px}
h1 span{display:block;color:var(--red);font-size:26px;letter-spacing:3px;margin-top:4px}
#meta{color:var(--ash);font-size:14px;text-align:right}
#meta b{color:var(--red2)}
nav{max-width:1100px;margin:auto;padding:8px 20px;display:flex;gap:8px;flex-wrap:wrap}
nav button{font:700 16px "Barlow Condensed",sans-serif;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 16px;border-radius:999px;cursor:pointer}
nav button:hover{border-color:var(--red)}
nav button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
nav button:focus-visible{outline:3px solid var(--red2);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:12px 20px 60px}
h2{font:800 26px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:1px;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-left:6px solid #333;border-radius:6px;padding:12px 14px}
.card.in_net{border-left-color:var(--red2);box-shadow:0 0 0 1px var(--red),0 0 22px rgba(227,38,43,.35)}
.card.scheduled{border-left-color:var(--red)}
.card.played{border-left-color:#fff}
.card.played.L{border-left-color:#555}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.tl{width:42px;height:42px;flex:none;display:grid;place-items:center}
.tl img{max-width:100%;max-height:100%;display:block;filter:drop-shadow(0 0 1px rgba(255,255,255,.35))}
.nm{font:700 22px "Barlow Condensed",sans-serif}.tm{color:var(--ash);font-size:14px}
.badge{font:700 14px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.5px;padding:2px 10px;border-radius:3px;background:#2a2a2a;color:var(--ash);white-space:nowrap}
.in_net .badge{background:var(--red2);color:#fff;animation:pulse 1.6s infinite}
.scheduled .badge{background:transparent;color:var(--red2);box-shadow:inset 0 0 0 1.5px var(--red)}
.played .badge{background:#fff;color:#0a0a0a}
.card.L .badge{background:#444!important;color:#ddd!important}
.error .badge,.unsupported .badge{background:var(--deep);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,59,64,0)}0%{box-shadow:0 0 0 0 rgba(255,59,64,.6)}}
.det{font-size:14px;margin:6px 0;color:#ddd}
details summary{cursor:pointer;color:var(--ash);font-size:14px}
details summary:hover{color:var(--red2)}
ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:#ccc}
li::marker{color:var(--red)}
details{margin-top:6px}
.past summary b{color:var(--ink)}
.gl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.gl th,.gl td{padding:4px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.gl th{color:var(--ash);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.gl td.opp{white-space:normal}
.gl .r{font-weight:700}.gl .rW{color:#fff}.gl .rW::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red2);margin-right:5px;vertical-align:middle}
.gl .rL,.gl .rT{color:var(--ash)}
.gl .num{text-align:right}
code{background:#222;padding:1px 5px;border-radius:3px}
.err{background:var(--card);border:1px solid var(--red);padding:16px;border-radius:6px}
@media(max-width:560px){h1{font-size:32px}h1 span{font-size:20px}.logo{height:64px}#meta{text-align:left}}
</style></head><body>
<div class="stripe"></div>
<header><div class="brand"><div class="logo"><img src="logo.png?v=2" alt="Goalie Mindset Pro logo" onerror="this.parentNode.remove()"></div><h1>Goalie Mindset<span>Pro Client Tracker</span></h1></div><div id="meta"></div></header>
<nav id="f" aria-label="Filter"></nav><main id="m">Loading…</main>
<script>
const LABEL={in_net:"In net",scheduled:"Game today",played:"Played today",not_playing:"Not playing",result_only:"Final",no_game:"No game",live_unknown:"Game on",unsupported:"No feed",error:"Feed error"};
const ORDER={in_net:0,live_unknown:1,scheduled:2,played:3,result_only:4,not_playing:5,no_game:6,unsupported:7,error:8};
const badge=p=>p.status=="played"&&p.result?({W:"Win",L:"Loss",T:"Tie"}[p.result]||"Played"):(LABEL[p.status]||p.status);
const statLine=s=>`${s.saves??"?"} saves on ${s.sa??"?"} shots, ${s.ga??"?"} against${s.svpct?`, ${s.svpct} SV%`:""}${s.shutout?", shutout":""}`;
let D,filter="All";
const logoAlts=u=>{const m=String(u||"").match(/^(.*\/logos\/)(\d+)\.png$/);return m?[m[1]+"50x50/"+m[2]+".png",m[1]+m[2]+".jpg",m[1]+m[2]+".gif"]:[]};
function nextLogo(i){const a=(i.dataset.alts||"").split("|").filter(Boolean);if(a.length){i.src=a.shift();i.dataset.alts=a.join("|")}else i.parentNode.remove()}
const shortDate=d=>{try{return new Date(d+"T12:00").toLocaleDateString([],{month:"short",day:"numeric"})}catch(e){return d}};
function summary(r){let w=0,l=0,t=0,sv=0,sa=0,so=0;
 r.forEach(g=>{if(g.result=="W")w++;else if(g.result=="L")l++;else if(g.result=="T")t++;
  if(g.stats){sv+=g.stats.saves||0;sa+=g.stats.sa||0;if(g.stats.shutout)so++}});
 return `<b>${w}-${l}${t?"-"+t:""}</b>${sa?`, ${(sv/sa).toFixed(3).replace(/^0/,"")} SV%`:""}${so?`, ${so} SO`:""}`}
const pastTable=r=>`<details class="past"><summary>Last ${r.length} game${r.length>1?"s":""} played: ${summary(r)}</summary><table class="gl"><thead><tr><th>Date</th><th>Opp</th><th>Result</th><th class="num">Saves</th><th class="num">SV%</th></tr></thead><tbody>${
 r.map(g=>`<tr><td>${esc(shortDate(g.date))}</td><td class="opp">${esc(g.ha)} ${esc(g.opp)}</td><td class="r r${esc(g.result||"")}">${esc(g.result||"–")} ${esc(g.score||"")}</td><td class="num">${g.stats?`${g.stats.saves??"?"}/${g.stats.sa??"?"}`:"–"}</td><td class="num">${g.stats?.svpct?esc(g.stats.svpct)+(g.stats.shutout?" SO":""):"–"}</td></tr>`).join("")
}</tbody></table></details>`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
 const leagues=[...new Set(D.players.map(p=>p.league))];
 f.innerHTML=["All","Live now",...leagues].map(l=>`<button aria-pressed="${l==filter}" data-l="${l}">${l}</button>`).join("");
 f.querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.l;render()});
 let ps=D.players; if(filter=="Live now")ps=ps.filter(p=>p.status=="in_net"); else if(filter!="All")ps=ps.filter(p=>p.league==filter);
 const nIn=D.players.filter(p=>p.status=="in_net").length;
 meta.innerHTML=`<b>${nIn} in net now</b><br>Updated ${new Date(D.updated).toLocaleString()}`;
 let html="";
 for(const lg of leagues){const g=ps.filter(p=>p.league==lg).sort((a,b)=>ORDER[a.status]-ORDER[b.status]);if(!g.length)continue;
  html+=`<h2>${lg}</h2><div class="grid">`+g.map(p=>`<div class="card ${p.status} ${p.result||''}"><div class="top"><div class="who">${p.logo?`<span class="tl"><img src="${esc(p.logo)}" data-alts="${esc(logoAlts(p.logo).join("|"))}" alt="${esc(p.team)} logo" loading="lazy" onerror="nextLogo(this)"></span>`:""}<div><div class="nm">${esc(p.name)}</div><div class="tm">${esc(p.team)}</div></div></div><span class="badge">${badge(p)}</span></div>
  <div class="det">${esc(p.detail)}</div>${p.stats?`<div class="det">${statLine(p.stats)}</div>`:""}${p.recent?.length?pastTable(p.recent):""}${p.upcoming?.length?`<details><summary>Next ${p.upcoming.length} games</summary><ul>${p.upcoming.map(u=>`<li>${esc(u.date)}: ${esc(u.away)} at ${esc(u.home)}</li>`).join("")}</ul></details>`:""}</div>`).join("")+`</div>`;}
 m.innerHTML=html||"No goalies match this filter.";
}
async function load(){try{D=await (await fetch("data.json?"+Date.now())).json();render()}catch(e){m.innerHTML=`<div class="err">Couldn't load data.json. Run <code>python3 goalie_tracker.py --serve</code> and open this page from <code>http://localhost:8000</code>, not by double-clicking the file.</div>`}}
load();setInterval(load,60000);
</script></body></html>
